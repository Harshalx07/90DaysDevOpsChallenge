apiVersion: v1
kind: Pod
metadata:
  name: configmap-env
spec:
  containers:
  - name: busybox
    image: busybox
    command:
      - sh
      - -c
      - |
        while true
        do
          echo "APP_ENV=$APP_ENV"
          echo "APP_DEBUG=$APP_DEBUG"
          echo "APP_PORT=$APP_PORT"
          sleep 10
        done
    envFrom:
      - configMapRef:
          name: app-config
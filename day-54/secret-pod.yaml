apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
  - name: busybox
    image: busybox
    command:
      - sh
      - -c
      - |
        while true
        do
          echo "DB_USER=$DB_USER"
          cat /etc/db-credentials/DB_PASSWORD
          sleep 10
        done

    env:
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: db-credentials
            key: DB_USER

    volumeMounts:
      - name: db-secret
        mountPath: /etc/db-credentials
        readOnly: true

  volumes:
    - name: db-secret
      secret:
        secretName: db-credentials